<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CARDÉ — Sell</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
color:#111;
background:#fff;
}

a{
text-decoration:none;
color:inherit;
}

header{
height:82px;
padding:0 50px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:100;
background:rgba(255,255,255,.96);
backdrop-filter:blur(10px);
}

.logo{
font-size:24px;
font-weight:500;
letter-spacing:7px;
}

nav{
display:flex;
gap:38px;
font-size:10px;
letter-spacing:2px;
}

nav a:hover,
.header-right a:hover{
opacity:.45;
}

.header-right{
display:flex;
gap:22px;
font-size:10px;
letter-spacing:2px;
}

.page{
max-width:1000px;
margin:auto;
padding:80px 40px 130px;
}

.back{
font-size:9px;
letter-spacing:2px;
color:#999;
}

.back:hover{
color:#111;
}

.title-area{
margin-top:55px;
margin-bottom:55px;
}

.eyebrow{
font-size:9px;
letter-spacing:3px;
color:#999;
margin-bottom:18px;
}

h1{
font-size:42px;
font-weight:400;
}

.sub{
margin-top:15px;
font-size:11px;
color:#888;
}

.form{
border-top:1px solid #eee;
}

.field{
padding:28px 0;
border-bottom:1px solid #eee;
}

label{
display:block;
font-size:9px;
letter-spacing:2px;
color:#888;
margin-bottom:12px;
}

input,
select,
textarea{
width:100%;
border:1px solid #ddd;
background:#fff;
padding:15px;
font-family:Arial,Helvetica,sans-serif;
font-size:12px;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:#111;
}

textarea{
min-height:150px;
resize:vertical;
line-height:1.6;
}

.price-wrap{
display:flex;
align-items:center;
}

.price-symbol{
padding:15px;
border:1px solid #ddd;
border-right:none;
font-size:12px;
background:#fafafa;
}

.price-wrap input{
border-left:none;
}

.image-area{
display:flex;
flex-direction:column;
gap:15px;
}

.image-preview{
width:220px;
aspect-ratio:3/4;
background:#f5f5f5;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.image-preview img{
width:100%;
height:100%;
object-fit:contain;
}

.placeholder{
font-size:9px;
letter-spacing:3px;
color:#aaa;
text-align:center;
}

.file-input{
border:none;
padding:0;
font-size:11px;
}

.button-area{
padding-top:40px;
}

button{
width:100%;
height:58px;
border:1px solid #111;
background:#111;
color:#fff;
font-size:10px;
letter-spacing:3px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#fff;
color:#111;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.message{
margin-top:25px;
text-align:center;
font-size:10px;
letter-spacing:2px;
line-height:1.8;
}

.success{
color:#111;
}

.error{
color:#999;
}

footer{
border-top:1px solid #eee;
padding:50px;
display:flex;
justify-content:space-between;
}

.footer-logo{
font-size:18px;
letter-spacing:5px;
}

.footer-text{
font-size:9px;
line-height:1.8;
color:#999;
text-align:right;
}

@media(max-width:600px){

header{
padding:0 20px;
}

nav{
display:none;
}

.header-right{
gap:12px;
}

.page{
padding:50px 20px 100px;
}

h1{
font-size:32px;
}

footer{
padding:35px 20px;
flex-direction:column;
gap:25px;
}

.footer-text{
text-align:left;
}

}

</style>

</head>


<body>


<header>

<a href="index.html" class="logo">
CARDÉ
</a>


<nav>

<a href="index.html#collection">
COLLECTION
</a>

<a href="sell.html">
SELL
</a>

<a href="index.html#about">
ABOUT
</a>

</nav>


<div class="header-right">

<a href="#">
SEARCH
</a>

<a href="#">
♡
</a>

<a href="#">
LOGIN
</a>

</div>

</header>



<main class="page">


<a href="index.html#collection" class="back">
← BACK TO COLLECTION
</a>



<div class="title-area">

<div class="eyebrow">
CARDÉ MARKET
</div>

<h1>
Sell Your Card
</h1>

<div class="sub">
List your card on CARDÉ
</div>

</div>



<form id="sellForm" class="form">


<div class="field">

<label for="category">
CATEGORY
</label>

<select id="category" required>

<option value="">
SELECT GAME
</option>

<option value="Pokémon">
Pokémon
</option>

<option value="One Piece">
One Piece
</option>

<option value="Weiss Schwarz">
Weiss Schwarz
</option>

<option value="Build Divide">
Build Divide
</option>

</select>

</div>



<div class="field">

<label for="cardName">
CARD NAME
</label>

<input
type="text"
id="cardName"
placeholder="Enter card name"
required
>

</div>



<div class="field">

<label for="price">
PRICE
</label>


<div class="price-wrap">

<div class="price-symbol">
₩
</div>

<input
type="number"
id="price"
placeholder="Enter your price"
min="0"
step="1"
required
>

</div>

</div>



<div class="field">

<label for="condition">
CONDITION
</label>

<select id="condition" required>

<option value="">
SELECT CONDITION
</option>

<option value="Mint">
Mint
</option>

<option value="Near Mint">
Near Mint
</option>

<option value="Excellent">
Excellent
</option>

<option value="Good">
Good
</option>

<option value="Played">
Played
</option>

</select>

</div>



<div class="field">

<label for="image">
CARD IMAGE
</label>


<div class="image-area">

<div
id="imagePreview"
class="image-preview"
>

<div class="placeholder">
CARD IMAGE
</div>

</div>


<input
type="file"
id="image"
class="file-input"
accept="image/*"
>

</div>

</div>



<div class="field">

<label for="description">
DESCRIPTION
</label>

<textarea
id="description"
placeholder="Describe your card, condition, accessories, etc."
></textarea>

</div>



<div class="button-area">

<button
type="submit"
id="submitButton"
>
LIST CARD
</button>

<div
id="message"
class="message"
></div>

</div>


</form>


</main>



<footer>

<div class="footer-logo">
CARDÉ
</div>

<div class="footer-text">
CARDÉ — A CURATED CARD MARKET<br>
© 2026 CARDÉ. ALL RIGHTS RESERVED.
</div>

</footer>



<script>


const SUPABASE_URL =
"https://byjnjciwsdwxuneusgau.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_9-MEV3xReYbJBBSQFAW_xA_sxniWNBl";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



const form =
document.getElementById("sellForm");

const imageInput =
document.getElementById("image");

const imagePreview =
document.getElementById("imagePreview");

const message =
document.getElementById("message");

const submitButton =
document.getElementById("submitButton");



let imageData = "";



imageInput.addEventListener(
"change",
function(){

const file =
this.files[0];

if(!file){

imageData = "";

imagePreview.innerHTML = `
<div class="placeholder">
CARD IMAGE
</div>
`;

return;

}


const reader =
new FileReader();


reader.onload =
function(event){

imageData =
event.target.result;

imagePreview.innerHTML = `
<img
src="${imageData}"
alt="Card Preview"
>
`;

};


reader.readAsDataURL(file);

});



form.addEventListener(
"submit",
async function(event){

event.preventDefault();


message.textContent = "";

message.className =
"message";


const category =
document
.getElementById("category")
.value;


const cardName =
document
.getElementById("cardName")
.value
.trim();


const price =
Number(
document
.getElementById("price")
.value
);


const condition =
document
.getElementById("condition")
.value;


const description =
document
.getElementById("description")
.value
.trim();



if(!category){

message.textContent =
"PLEASE SELECT A GAME.";

message.className =
"message error";

return;

}


if(!cardName){

message.textContent =
"PLEASE ENTER A CARD NAME.";

message.className =
"message error";

return;

}


if(!Number.isFinite(price) || price < 0){

message.textContent =
"PLEASE ENTER A VALID PRICE.";

message.className =
"message error";

return;

}


if(!condition){

message.textContent =
"PLEASE SELECT A CONDITION.";

message.className =
"message error";

return;

}



submitButton.disabled =
true;

submitButton.textContent =
"LISTING...";



try{


const { error } =
await supabaseClient
.from("products")
.insert({

category:

category,

card_name:

cardName,

price:

price,

condition:

condition,

image_url:

imageData,

description:

description

});


if(error){

console.error(error);

throw error;

}



message.textContent =
"LISTED ✓";


message.className =
"message success";


const successText =
document.createElement("div");

successText.textContent =
"Your card has been successfully listed.";


message.appendChild(
successText
);



form.reset();


imageData = "";


imagePreview.innerHTML = `
<div class="placeholder">
CARD IMAGE
</div>
`;



}catch(error){


console.error(error);


message.textContent =
"LISTING FAILED";


message.className =
"message error";


const errorText =
document.createElement("div");

errorText.textContent =
error.message ||
"Please try again later.";


message.appendChild(
errorText
);


}finally{


submitButton.disabled =
false;

submitButton.textContent =
"LIST CARD";


}

});


</script>


</body>
</html>
