<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CARDÉ — List Your Card</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    header {
      height: 82px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .logo {
      font-size: 25px;
      letter-spacing: 7px;
      font-weight: 600;
      text-decoration: none;
      color: #111;
    }

    nav {
      display: flex;
      gap: 34px;
    }

    nav a {
      color: #111;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
    }

    nav a:hover {
      opacity: .5;
    }

    main {
      max-width: 850px;
      margin: 100px auto;
      padding: 0 25px;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 48px;
      font-weight: 400;
      letter-spacing: -2px;
      margin: 0 0 65px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
    }

    .field {
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #aaa;
      padding: 13px 0;
      font-size: 15px;
      outline: none;
      background: transparent;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-bottom: 1px solid #111;
    }

    textarea {
      height: 110px;
      resize: vertical;
    }

    input[type="file"] {
      border: 1px solid #ddd;
      padding: 15px;
      font-size: 12px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      height: 58px;
      border: 1px solid #111;
      background: #111;
      color: #fff;
      font-size: 11px;
      letter-spacing: 3px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #message {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
    }

    footer {
      border-top: 1px solid #e5e5e5;
      padding: 40px 6%;
      margin-top: 100px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #777;
    }

    @media (max-width: 700px) {
      header {
        padding: 0 20px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 9px;
      }

      main {
        margin: 60px auto;
      }

      h1 {
        font-size: 38px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    CARDÉ
  </a>

  <nav>
    <a href="index.html">MARKET</a>
    <a href="index.html#operator">OPERATOR SHOP</a>
    <a href="sell.html">SELL</a>
  </nav>

</header>


<main>

  <div class="eyebrow">
    CARDÉ MARKETPLACE
  </div>

  <h1>
    LIST YOUR CARD
  </h1>


  <form id="sellForm">

    <div class="form-row">

      <div class="field">

        <label>CATEGORY</label>

        <select id="category" required>

          <option value="">
            SELECT CATEGORY
          </option>

          <option value="Pokémon">
            Pokémon
          </option>

          <option value="One Piece">
            One Piece
          </option>

          <option value="Weiss Schwarz">
            Weiss Schwarz
          </option>

          <option value="Build Divide">
            Build Divide
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <div class="field">

        <label>CARD NAME</label>

        <input
          type="text"
          id="cardName"
          placeholder="Enter card name"
          required
        >

      </div>

    </div>


    <div class="form-row">

      <div class="field">

        <label>PRICE (KRW)</label>

        <input
          type="number"
          id="price"
          placeholder="Enter price"
          min="0"
          required
        >

      </div>


      <div class="field">

        <label>CONDITION</label>

        <select id="condition">

          <option value="Mint">
            Mint
          </option>

          <option value="Near Mint">
            Near Mint
          </option>

          <option value="Excellent">
            Excellent
          </option>

          <option value="Good">
            Good
          </option>

          <option value="Played">
            Played
          </option>

        </select>

      </div>

    </div>


    <div class="field">

      <label>CARD IMAGE</label>

      <input
        type="file"
        id="cardImage"
        accept="image/*"
      >

    </div>


    <div class="field">

      <label>DESCRIPTION</label>

      <textarea
        id="description"
        placeholder="Describe your card..."
      ></textarea>

    </div>


    <button
      type="submit"
      id="submitButton"
    >
      LIST CARD
    </button>


    <div id="message"></div>

  </form>

</main>


<footer>
  CARDÉ — A CURATED CARD MARKET
</footer>


<script>

  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL =
    "https://byjnjciwsdwxuneusgau.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_9-MEV3xRebYJBBSQFAW_xA_sxniWNBl";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==========================================
  // FORM
  // ==========================================

  const form =
    document.getElementById("sellForm");

  const button =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");


  // ==========================================
  // SUBMIT
  // ==========================================

  form.addEventListener(
    "submit",
    async function(event) {

      // 페이지 새로고침 방지
      event.preventDefault();

      button.disabled = true;
      button.textContent = "LISTING...";

      message.textContent = "";


      try {

        // ======================================
        // 입력값 가져오기
        // ======================================

        const category =
          document.getElementById("category").value;

        const cardName =
          document
            .getElementById("cardName")
            .value
            .trim();

        const price =
          Number(
            document.getElementById("price").value
          );

        const condition =
          document.getElementById("condition").value;

        const description =
          document
            .getElementById("description")
            .value
            .trim();

        const imageFile =
          document
            .getElementById("cardImage")
            .files[0];


        // ======================================
        // 이미지
        // ======================================

        let imageUrl = "";

        if (imageFile) {

          imageUrl = await new Promise(
            function(resolve, reject) {

              const reader =
                new FileReader();

              reader.onload =
                function() {
                  resolve(reader.result);
                };

              reader.onerror =
                function() {
                  reject(reader.error);
                };

              reader.readAsDataURL(imageFile);

            }
          );

        }


        // ======================================
        // SUPABASE DATABASE에 상품 등록
        // ======================================

        const { error } =
          await supabaseClient
            .from("products")
            .insert({

              category: category,

              card_name: cardName,

              price: price,

              condition: condition,

              image_url: imageUrl,

              description: description

            });


        // ======================================
        // 오류 확인
        // ======================================

        if (error) {
          throw error;
        }


        // ======================================
        // 성공
        // ======================================

        message.textContent =
          "Your card has been successfully listed.";

        message.style.color = "green";

        form.reset();

        button.textContent =
          "LISTED ✓";


      } catch (error) {

        // ======================================
        // 오류 표시
        // ======================================

        console.error(
          "CARDÉ ERROR:",
          error
        );

        message.textContent =
          "ERROR: " + error.message;

        message.style.color = "red";

        button.disabled = false;

        button.textContent =
          "LIST CARD";

      }

    }
  );

</script>

</body>
</html>
