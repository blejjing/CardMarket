<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CARDÉ — Product</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      height: 82px;
      padding: 0 50px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #eee;

      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 7px;
    }

    nav {
      display: flex;
      gap: 38px;

      font-size: 10px;
      letter-spacing: 2px;
    }

    nav a {
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 0.45;
    }

    .header-right {
      display: flex;
      gap: 22px;

      font-size: 10px;
      letter-spacing: 2px;
    }

    .header-right a {
      transition: opacity 0.3s ease;
    }

    .header-right a:hover {
      opacity: 0.45;
    }


    /* =========================
       PRODUCT
    ========================= */

    .product-page {
      max-width: 1300px;

      margin: 0 auto;

      padding: 90px 40px 150px;

      display: grid;

      grid-template-columns:
        1.1fr 0.9fr;

      gap: 80px;
    }


    /* =========================
       IMAGE
    ========================= */

    .product-main-image {
      width: 100%;
      height: 650px;

      background: #f5f5f5;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .product-main-image img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      transition:
        transform 0.6s ease;
    }

    .product-main-image:hover img {
      transform: scale(1.025);
    }

    .image-placeholder {
      font-size: 10px;

      letter-spacing: 3px;

      color: #aaa;
    }


    /* =========================
       INFO
    ========================= */

    .product-info {
      padding-top: 20px;
    }

    .product-category {
      font-size: 9px;

      letter-spacing: 3px;

      color: #999;

      margin-bottom: 20px;
    }

    .product-name {
      font-size: 34px;

      font-weight: 400;

      line-height: 1.25;

      margin-bottom: 25px;
    }

    .product-price {
      font-size: 24px;

      font-weight: 500;

      margin-bottom: 35px;
    }


    /* =========================
       DETAILS
    ========================= */

    .details {
      border-top: 1px solid #eee;

      border-bottom: 1px solid #eee;

      margin-bottom: 35px;
    }

    .detail-row {
      display: flex;

      justify-content: space-between;

      padding: 18px 0;

      border-bottom: 1px solid #eee;

      font-size: 10px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #999;

      letter-spacing: 1px;
    }

    .detail-value {
      text-align: right;
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .description {
      margin-bottom: 35px;
    }

    .description-title {
      font-size: 9px;

      letter-spacing: 2px;

      color: #999;

      margin-bottom: 12px;
    }

    .description-text {
      font-size: 11px;

      line-height: 1.8;

      color: #555;
    }


    /* =========================
       BUY BUTTON
    ========================= */

    .buy-button {
      width: 100%;

      height: 55px;

      border: none;

      background: #111;

      color: #fff;

      font-size: 10px;

      letter-spacing: 3px;

      cursor: pointer;

      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .buy-button:hover {
      background: #333;

      transform: translateY(-2px);
    }


    /* =========================
       BACK
    ========================= */

    .back-link {
      display: inline-block;

      margin-bottom: 30px;

      font-size: 9px;

      letter-spacing: 2px;

      color: #999;

      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #111;
    }


    /* =========================
       LOADING
    ========================= */

    .loading {
      min-height: 500px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 10px;

      letter-spacing: 3px;

      color: #999;
    }


    /* =========================
       ERROR
    ========================= */

    .error {
      min-height: 500px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    .error h2 {
      font-size: 18px;

      font-weight: 400;

      margin-bottom: 15px;
    }

    .error p {
      font-size: 10px;

      color: #999;

      margin-bottom: 25px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid #eee;

      padding: 50px;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;
    }

    .footer-logo {
      font-size: 18px;

      letter-spacing: 5px;
    }

    .footer-text {
      font-size: 9px;

      line-height: 1.8;

      color: #999;

      text-align: right;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      header {
        padding: 0 20px;
      }

      nav {
        display: none;
      }

      .header-right {
        gap: 12px;
      }

      .product-page {
        grid-template-columns: 1fr;

        gap: 45px;

        padding:
          50px 20px 100px;
      }

      .product-main-image {
        height: 500px;
      }

      .product-name {
        font-size: 28px;
      }

      footer {
        padding: 35px 20px;

        flex-direction: column;

        gap: 25px;
      }

      .footer-text {
        text-align: left;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <a
      href="index.html"
      class="logo"
    >
      CARDÉ
    </a>


    <nav>

      <a href="index.html#collection">
        COLLECTION
      </a>

      <a href="index.html#operator-shop">
        OPERATOR SHOP
      </a>

      <a href="sell.html">
        SELL
      </a>

      <a href="index.html#about">
        ABOUT
      </a>

    </nav>


    <div class="header-right">

      <a href="#">
        SEARCH
      </a>

      <a href="#">
        ♡
      </a>

      <a href="#">
        LOGIN
      </a>

    </div>

  </header>



  <!-- =========================
       PRODUCT AREA
  ========================= -->

  <main id="productArea">

    <div class="loading">
      LOADING PRODUCT
    </div>

  </main>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <div class="footer-logo">
      CARDÉ
    </div>


    <div class="footer-text">

      CARDÉ — A CURATED CARD MARKET<br>

      © 2026 CARDÉ. ALL RIGHTS RESERVED.

    </div>

  </footer>



  <!-- =========================
       SUPABASE
  ========================= -->

  <script>

    const SUPABASE_URL =
      "https://byjnjciwsdwxuneusgau.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_9-MEV3xReYbJBBSQFAW_xA_sxniWNBl";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       GET PRODUCT ID
    ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const productId =
      params.get("id");


    /* =========================
       LOAD PRODUCT
    ========================= */

    async function loadProduct() {

      const area =
        document.getElementById(
          "productArea"
        );


      if (!productId) {

        showError(
          "Product Not Found",
          "No product was selected."
        );

        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select(
            "id, category, card_name, price, condition, image_url, description, created_at"
          )
          .eq(
            "id",
            productId
          )
          .single();


      if (
        error ||
        !data
      ) {

        console.error(error);

        showError(
          "Product Not Found",
          "This product may no longer be available."
        );

        return;
      }


      renderProduct(data);

    }


    /* =========================
       RENDER
    ========================= */

    function renderProduct(product) {

      const area =
        document.getElementById(
          "productArea"
        );


      let imageHTML = "";


      if (
        product.image_url
      ) {

        imageHTML = `

          <img
            src="${product.image_url}"
            alt="${product.card_name}"
          >

        `;

      }

      else {

        imageHTML = `

          <div class="image-placeholder">
            PRODUCT IMAGE
          </div>

        `;

      }


      area.innerHTML = `

        <section class="product-page">


          <div>

            <a
              href="pokemon.html"
              class="back-link"
            >
              ← BACK TO POKÉMON
            </a>


            <div class="product-main-image">

              ${imageHTML}

            </div>

          </div>



          <div class="product-info">


            <div class="product-category">

              ${product.category || "CARD"}

            </div>


            <h1 class="product-name">

              ${product.card_name || "Untitled Card"}

            </h1>


            <div class="product-price">

              ₩${Number(
                product.price || 0
              ).toLocaleString()}

            </div>



            <div class="details">


              <div class="detail-row">

                <div class="detail-label">
                  CONDITION
                </div>

                <div class="detail-value">
                  ${product.condition || "Not specified"}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  CATEGORY
                </div>

                <div class="detail-value">
                  ${product.category || "—"}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  LISTED
                </div>

                <div class="detail-value">
                  ${formatDate(product.created_at)}
                </div>

              </div>


            </div>



            <div class="description">

              <div class="description-title">
                DESCRIPTION
              </div>


              <div class="description-text">

                ${
                  product.description ||
                  "No description provided."
                }

              </div>

            </div>



            <button
              class="buy-button"
              onclick="buyProduct()"
            >

              BUY NOW

            </button>


          </div>


        </section>

      `;

    }


    /* =========================
       DATE
    ========================= */

    function formatDate(
      date
    ) {

      if (!date) {
        return "—";
      }


      return new Date(
        date
      ).toLocaleDateString(
        "en-US",
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );

    }


    /* =========================
       BUY
    ========================= */

    function buyProduct() {

      alert(
        "The purchase system will be connected later."
      );

    }


    /* =========================
       ERROR
    ========================= */

    function showError(
      title,
      message
    ) {

      const area =
        document.getElementById(
          "productArea"
        );


      area.innerHTML = `

        <div class="error">

          <h2>
            ${title}
          </h2>

          <p>
            ${message}
          </p>

          <a
            href="pokemon.html"
            class="button"
          >
            BACK TO SHOP
          </a>

        </div>

      `;

    }


    /* =========================
       START
    ========================= */

    loadProduct();

  </script>


</body>
</html>
