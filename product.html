<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CARDÉ — Product</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      height: 82px;
      padding: 0 50px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #eee;

      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 7px;
    }

    nav {
      display: flex;
      gap: 38px;

      font-size: 10px;
      letter-spacing: 2px;
    }

    nav a {
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 0.45;
    }

    .header-right {
      display: flex;
      gap: 22px;

      font-size: 10px;
      letter-spacing: 2px;
    }

    .header-right a {
      transition: opacity 0.3s ease;
    }

    .header-right a:hover {
      opacity: 0.45;
    }

    .product-page {
      max-width: 1300px;

      margin: 0 auto;

      padding: 90px 40px 150px;

      display: grid;

      grid-template-columns:
        1.1fr 0.9fr;

      gap: 80px;
    }

    .product-main-image {
      width: 100%;
      height: 650px;

      background: #f5f5f5;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .product-main-image img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      transition:
        transform 0.6s ease;
    }

    .product-main-image:hover img {
      transform: scale(1.025);
    }

    .image-placeholder {
      font-size: 10px;

      letter-spacing: 3px;

      color: #aaa;
    }

    .product-info {
      padding-top: 20px;
    }

    .product-category {
      font-size: 9px;

      letter-spacing: 3px;

      color: #999;

      margin-bottom: 20px;
    }

    .product-name {
      font-size: 34px;

      font-weight: 400;

      line-height: 1.25;

      margin-bottom: 25px;
    }

    .product-price {
      font-size: 24px;

      font-weight: 500;

      margin-bottom: 35px;
    }

    .details {
      border-top: 1px solid #eee;

      border-bottom: 1px solid #eee;

      margin-bottom: 35px;
    }

    .detail-row {
      display: flex;

      justify-content: space-between;

      padding: 18px 0;

      border-bottom: 1px solid #eee;

      font-size: 10px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #999;

      letter-spacing: 1px;
    }

    .detail-value {
      text-align: right;
    }

    .description {
      margin-bottom: 35px;
    }

    .description-title {
      font-size: 9px;

      letter-spacing: 2px;

      color: #999;

      margin-bottom: 12px;
    }

    .description-text {
      font-size: 11px;

      line-height: 1.8;

      color: #555;

      white-space: pre-wrap;
    }

    .buy-button {
      width: 100%;

      height: 55px;

      border: none;

      background: #111;

      color: #fff;

      font-size: 10px;

      letter-spacing: 3px;

      cursor: pointer;

      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .buy-button:hover {
      background: #333;

      transform: translateY(-2px);
    }

    .buy-button:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }

    .login-message {
      margin-top: 12px;

      font-size: 9px;

      line-height: 1.6;

      color: #999;

      text-align: center;

      letter-spacing: 1px;
    }

    .back-link {
      display: inline-block;

      margin-bottom: 30px;

      font-size: 9px;

      letter-spacing: 2px;

      color: #999;

      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #111;
    }

    .loading {
      min-height: 500px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 10px;

      letter-spacing: 3px;

      color: #999;
    }

    .error {
      min-height: 500px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    .error h2 {
      font-size: 18px;

      font-weight: 400;

      margin-bottom: 15px;
    }

    .error p {
      font-size: 10px;

      color: #999;

      margin-bottom: 25px;
    }

    .error-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      height: 45px;

      padding: 0 25px;

      background: #111;

      color: #fff;

      font-size: 9px;

      letter-spacing: 2px;
    }

    footer {
      border-top: 1px solid #eee;

      padding: 50px;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;
    }

    .footer-logo {
      font-size: 18px;

      letter-spacing: 5px;
    }

    .footer-text {
      font-size: 9px;

      line-height: 1.8;

      color: #999;

      text-align: right;
    }

    @media (max-width: 800px) {

      header {
        padding: 0 20px;
      }

      nav {
        display: none;
      }

      .header-right {
        gap: 12px;
      }

      .product-page {
        grid-template-columns: 1fr;

        gap: 45px;

        padding:
          50px 20px 100px;
      }

      .product-main-image {
        height: 500px;
      }

      .product-name {
        font-size: 28px;
      }

      footer {
        padding: 35px 20px;

        flex-direction: column;

        gap: 25px;
      }

      .footer-text {
        text-align: left;
      }

    }
  </style>
</head>

<body>

  <header>

    <a
      href="index.html"
      class="logo"
    >
      CARDÉ
    </a>

    <nav>

      <a href="index.html#collection">
        COLLECTION
      </a>

      <a href="index.html#operator-shop">
        OPERATOR SHOP
      </a>

      <a href="sell.html">
        SELL
      </a>

      <a href="index.html#about">
        ABOUT
      </a>

    </nav>

    <div class="header-right">

      <a href="#">
        SEARCH
      </a>

      <a href="#">
        ♡
      </a>

      <a href="login.html" id="loginLink">
        LOGIN
      </a>

    </div>

  </header>


  <main id="productArea">

    <div class="loading">
      LOADING PRODUCT
    </div>

  </main>


  <footer>

    <div class="footer-logo">
      CARDÉ
    </div>

    <div class="footer-text">

      CARDÉ — A CURATED CARD MARKET<br>

      © 2026 CARDÉ. ALL RIGHTS RESERVED.

    </div>

  </footer>


  <script>

    const SUPABASE_URL =
      "https://byjnjciwsdwxuneusgau.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_9-MEV3xReYBJBBSQFAW_xA_sxniWNBl";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const productId =
      params.get("id");


    let currentProduct = null;


    let currentUser = null;


    async function checkLogin(){

      try{

        const {
          data,
          error
        } =
          await supabaseClient.auth.getUser();


        if(error){

          console.error(error);

          currentUser = null;

          return;

        }


        currentUser =
          data?.user || null;


        updateLoginLink();

      }catch(error){

        console.error(error);

        currentUser = null;

      }

    }


    function updateLoginLink(){

      const loginLink =
        document.getElementById("loginLink");


      if(!loginLink){
        return;
      }


      if(currentUser){

        loginLink.textContent =
          "ACCOUNT";

        loginLink.href =
          "login.html";

      }else{

        loginLink.textContent =
          "LOGIN";

        loginLink.href =
          "login.html";

      }

    }


    async function loadProduct(){

      const area =
        document.getElementById(
          "productArea"
        );


      if(!productId){

        showError(
          "Product Not Found",
          "No product was selected."
        );

        return;

      }


      try{

        const {
          data,
          error
        } =
          await supabaseClient
            .from("products")
            .select(
              "id, category, card_name, price, image_url, condition, description, created_at"
            )
            .eq(
              "id",
              productId
            )
            .single();


        if(error || !data){

          console.error(error);

          showError(
            "Product Not Found",
            "This product may no longer be available."
          );

          return;

        }


        currentProduct = data;


        renderProduct(data);

      }catch(error){

        console.error(error);

        showError(
          "Unable To Load Product",
          error.message
        );

      }

    }


    function getBackLink(category){

      if(category === "Pokémon"){
        return "pokemon.html";
      }


      if(category === "One Piece"){
        return "onepiece.html";
      }


      if(category === "Weiss Schwarz"){
        return "weiss.html";
      }


      if(category === "Build Divide"){
        return "builddivide.html";
      }


      return "index.html#collection";

    }


    function getBackText(category){

      if(category === "Pokémon"){
        return "← BACK TO POKÉMON";
      }


      if(category === "One Piece"){
        return "← BACK TO ONE PIECE";
      }


      if(category === "Weiss Schwarz"){
        return "← BACK TO WEISS SCHWARZ";
      }


      if(category === "Build Divide"){
        return "← BACK TO BUILD DIVIDE";
      }


      return "← BACK TO COLLECTION";

    }


    function renderProduct(product){

      const area =
        document.getElementById(
          "productArea"
        );


      let imageHTML = "";


      if(product.image_url){

        imageHTML = `

          <img
            src="${product.image_url}"
            alt="${escapeHTML(product.card_name || "Card")}"
          >

        `;

      }else{

        imageHTML = `

          <div class="image-placeholder">
            PRODUCT IMAGE
          </div>

        `;

      }


      const backLink =
        getBackLink(product.category);


      const backText =
        getBackText(product.category);


      const loggedIn =
        !!currentUser;


      const buttonText =
        loggedIn
          ? "BUY NOW"
          : "LOGIN TO BUY";


      const loginMessage =
        loggedIn
          ? ""
          : `
            <div class="login-message">
              YOU MUST BE LOGGED IN TO PURCHASE THIS CARD.
            </div>
          `;


      area.innerHTML = `

        <section class="product-page">

          <div>

            <a
              href="${backLink}"
              class="back-link"
            >
              ${backText}
            </a>


            <div class="product-main-image">

              ${imageHTML}

            </div>

          </div>


          <div class="product-info">


            <div class="product-category">

              ${escapeHTML(product.category || "CARD")}

            </div>


            <h1 class="product-name">

              ${escapeHTML(product.card_name || "Untitled Card")}

            </h1>


            <div class="product-price">

              ₩${Number(
                product.price || 0
              ).toLocaleString()}

            </div>


            <div class="details">


              <div class="detail-row">

                <div class="detail-label">
                  CONDITION
                </div>

                <div class="detail-value">
                  ${escapeHTML(product.condition || "Not specified")}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  CATEGORY
                </div>

                <div class="detail-value">
                  ${escapeHTML(product.category || "—")}
                </div>

              </div>


              <div class="detail-row">

                <div class="detail-label">
                  LISTED
                </div>

                <div class="detail-value">
                  ${formatDate(product.created_at)}
                </div>

              </div>


            </div>


            <div class="description">

              <div class="description-title">
                DESCRIPTION
              </div>


              <div class="description-text">

                ${escapeHTML(
                  product.description ||
                  "No description provided."
                )}

              </div>

            </div>


            <button
              class="buy-button"
              id="buyButton"
              onclick="buyProduct()"
            >

              ${buttonText}

            </button>


            ${loginMessage}


          </div>

        </section>

      `;

    }


    function escapeHTML(value){

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(date){

      if(!date){
        return "—";
      }


      return new Date(
        date
      ).toLocaleDateString(
        "en-US",
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );

    }


    async function buyProduct(){

      if(!currentProduct){

        alert(
          "PRODUCT INFORMATION IS NOT AVAILABLE."
        );

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();


      if(error || !data?.user){

        alert(
          "PLEASE LOGIN TO PURCHASE THIS CARD."
        );


        window.location.href =
          "login.html?redirect=" +
          encodeURIComponent(
            window.location.href
          );


        return;

      }


      currentUser =
        data.user;


      const confirmed =
        confirm(
          "BUY THIS CARD FOR ₩" +
          Number(
            currentProduct.price || 0
          ).toLocaleString() +
          "?"
        );


      if(!confirmed){
        return;
      }


      /*
        실제 결제 시스템은 아직 연결되지 않았습니다.

        다음 단계에서:
        1. orders 테이블 생성
        2. 주문 생성
        3. 결제창 연결
        4. 결제 완료 처리
        5. 판매 상품 상태 변경

        순서로 연결할 수 있습니다.
      */


      alert(
        "LOGIN CONFIRMED.\n\n" +
        "PURCHASE SYSTEM IS READY TO BE CONNECTED."
      );

    }


    function showError(
      title,
      message
    ){

      const area =
        document.getElementById(
          "productArea"
        );


      area.innerHTML = `

        <div class="error">

          <h2>
            ${escapeHTML(title)}
          </h2>

          <p>
            ${escapeHTML(message)}
          </p>

          <a
            href="index.html#collection"
            class="error-button"
          >
            BACK TO SHOP
          </a>

        </div>

      `;

    }


    async function init(){

      await checkLogin();

      await loadProduct();

    }


    init();

  </script>


</body>
</html>
