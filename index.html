<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CARDÉ — Premium Card Market</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================
       HEADER
    ========================= */

    header {

      height: 82px;

      border-bottom: 1px solid #e8e8e8;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 6%;

    }


    .logo {

      color: #111;

      text-decoration: none;

      font-size: 25px;

      font-weight: 600;

      letter-spacing: 7px;

    }


    nav {

      display: flex;

      gap: 32px;

    }


    nav a {

      color: #111;

      text-decoration: none;

      font-size: 10px;

      letter-spacing: 2px;

    }


    nav a:hover {

      opacity: .5;

    }


    /* =========================
       HERO
    ========================= */

    .hero {

      min-height: 470px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding: 80px 20px;

    }


    .eyebrow {

      font-size: 10px;

      letter-spacing: 4px;

      color: #777;

      margin-bottom: 25px;

    }


    .hero h1 {

      margin: 0;

      font-size: 58px;

      font-weight: 400;

      letter-spacing: -3px;

      line-height: 1.05;

    }


    .hero p {

      margin-top: 25px;

      color: #777;

      font-size: 13px;

      letter-spacing: 1px;

    }


    .hero-button {

      margin-top: 35px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      width: 145px;

      height: 48px;

      background: #111;

      color: #fff;

      text-decoration: none;

      font-size: 10px;

      letter-spacing: 2px;

    }


    .hero-button:hover {

      background: #333;

    }


    /* =========================
       COLLECTION
    ========================= */

    .collection {

      padding: 75px 6% 120px;

    }


    .section-top {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 28px;

    }


    .section-title {

      font-size: 16px;

      letter-spacing: 2px;

    }


    .section-subtitle {

      font-size: 9px;

      letter-spacing: 2px;

      color: #777;

    }


    .collection-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;

    }


    .collection-card {

      position: relative;

      height: 330px;

      overflow: hidden;

      background: #f5f5f5;

      text-decoration: none;

      color: #111;

      display: block;

    }


    .collection-card img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      transition: transform .5s ease;

    }


    .collection-card:hover img {

      transform: scale(1.03);

    }


    .image-placeholder {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #aaa;

      font-size: 9px;

      letter-spacing: 2px;

    }


    .collection-info {

      position: absolute;

      left: 20px;

      bottom: 20px;

      z-index: 2;

    }


    .collection-name {

      font-size: 13px;

      letter-spacing: 2px;

      margin-bottom: 5px;

    }


    .collection-description {

      font-size: 9px;

      color: #777;

    }


    /* =========================
       FOOTER
    ========================= */

    footer {

      border-top: 1px solid #e8e8e8;

      padding: 35px 6%;

      color: #777;

      font-size: 9px;

      letter-spacing: 2px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {

      .collection-grid {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }


    @media (max-width: 600px) {

      header {

        padding: 0 20px;

      }


      nav {

        gap: 12px;

      }


      nav a {

        font-size: 8px;

      }


      .hero {

        min-height: 420px;

      }


      .hero h1 {

        font-size: 42px;

      }


      .collection {

        padding-left: 20px;

        padding-right: 20px;

      }


      .collection-grid {

        grid-template-columns: 1fr;

      }


      .collection-card {

        height: 300px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <a
      href="index.html"
      class="logo"
    >
      CARDÉ
    </a>


    <nav>

      <a href="index.html">
        HOME
      </a>

      <a href="sell.html">
        SELL
      </a>

      <a href="login.html">
        LOGIN
      </a>

    </nav>

  </header>



  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">

    <div class="eyebrow">
      CARDÉ COLLECTION
    </div>


    <h1>
      A Curated Card Market
    </h1>


    <p>
      Discover cards worth collecting.
    </p>


    <a
      href="#collection"
      class="hero-button"
    >
      EXPLORE
    </a>

  </section>



  <!-- =========================
       COLLECTION
  ========================= -->

  <section
    class="collection"
    id="collection"
  >

    <div class="section-top">

      <div class="section-title">
        COLLECTION
      </div>

      <div class="section-subtitle">
        CARD GAMES
      </div>

    </div>


    <div
      class="collection-grid"
      id="collectionGrid"
    >

      <!-- JavaScript로 자동 생성 -->

    </div>

  </section>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    CARDÉ — A CURATED CARD MARKET

  </footer>



  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://byjnjciwsdwxuneusgau.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_9-MEV3xRebYJBBSQFAW_xA_sxniWNBl";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const collectionGrid =
      document.getElementById(
        "collectionGrid"
      );


    /* =========================
       PAGE LINK
    ========================= */

    function getGameLink(gameName) {

      if (gameName === "POKÉMON") {

        return "pokemon.html";

      }


      if (gameName === "ONE PIECE") {

        return "onepiece.html";

      }


      if (gameName === "WEISS SCHWARZ") {

        return "weiss.html";

      }


      if (gameName === "BUILD DIVIDE") {

        return "builddivide.html";

      }


      return "#";

    }



    /* =========================
       LOAD COLLECTION
    ========================= */

    async function loadCollection() {

      const {
        data,
        error
      } =
        await supabaseClient

          .from("collection_settings")

          .select(
            "id, game_name, description, image_url"
          )

          .order(
            "id",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Collection error:",
          error
        );

        showDefaultCollection();

        return;

      }


      collectionGrid.innerHTML = "";


      data.forEach(function(item) {

        const link =
          getGameLink(
            item.game_name
          );


        const card =
          document.createElement(
            "a"
          );


        card.className =
          "collection-card";


        card.href = link;


        if (item.image_url) {

          const image =
            document.createElement(
              "img"
            );


          image.src =
            item.image_url;


          image.alt =
            item.game_name;


          card.appendChild(
            image
          );

        } else {

          const placeholder =
            document.createElement(
              "div"
            );


          placeholder.className =
            "image-placeholder";


          placeholder.textContent =
            "COLLECTION IMAGE";


          card.appendChild(
            placeholder
          );

        }


        const info =
          document.createElement(
            "div"
          );


        info.className =
          "collection-info";


        info.innerHTML = `

          <div class="collection-name">
            ${item.game_name}
          </div>

          <div class="collection-description">
            ${item.description || ""}
          </div>

        `;


        card.appendChild(
          info
        );


        collectionGrid.appendChild(
          card
        );

      });

    }



    /* =========================
       FALLBACK
    ========================= */

    function showDefaultCollection() {

      const games = [

        {
          name: "POKÉMON",
          description: "Discover Pokémon Cards",
          link: "pokemon.html"
        },

        {
          name: "ONE PIECE",
          description: "Discover One Piece Cards",
          link: "onepiece.html"
        },

        {
          name: "WEISS SCHWARZ",
          description: "Discover Weiss Schwarz Cards",
          link: "weiss.html"
        },

        {
          name: "BUILD DIVIDE",
          description: "Discover Build Divide Cards",
          link: "builddivide.html"
        }

      ];


      collectionGrid.innerHTML = "";


      games.forEach(function(game) {

        const card =
          document.createElement(
            "a"
          );


        card.className =
          "collection-card";


        card.href =
          game.link;


        card.innerHTML = `

          <div class="image-placeholder">
            COLLECTION IMAGE
          </div>

          <div class="collection-info">

            <div class="collection-name">
              ${game.name}
            </div>

            <div class="collection-description">
              ${game.description}
            </div>

          </div>

        `;


        collectionGrid.appendChild(
          card
        );

      });

    }



    loadCollection();

  </script>


</body>

</html>
