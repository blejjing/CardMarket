<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CARDÉ — Pokémon</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      height: 82px;
      padding: 0 50px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #eee;

      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 7px;
    }

    nav {
      display: flex;
      gap: 38px;

      font-size: 10px;
      letter-spacing: 2px;
    }

    nav a {
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 0.45;
    }

    .header-right {
      display: flex;
      gap: 22px;

      font-size: 10px;
      letter-spacing: 2px;
    }

    .header-right a {
      transition: opacity 0.3s ease;
    }

    .header-right a:hover {
      opacity: 0.45;
    }


    /* =========================
       PAGE TITLE
    ========================= */

    .page-title {
      padding: 120px 50px 80px;
      text-align: center;
    }

    .page-title .eyebrow {
      font-size: 10px;
      letter-spacing: 5px;
      color: #999;

      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 48px;
      font-weight: 400;

      letter-spacing: -1px;

      margin-bottom: 18px;
    }

    .page-title p {
      font-size: 12px;
      color: #888;
    }


    /* =========================
       FILTER BAR
    ========================= */

    .filter-bar {
      padding: 0 50px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid #eee;
    }

    .result-count {
      font-size: 9px;
      letter-spacing: 2px;
      color: #999;
    }

    .sort-select {
      border: none;
      border-bottom: 1px solid #ccc;

      padding: 8px 0;

      background: transparent;

      font-size: 9px;
      letter-spacing: 1px;

      outline: none;
    }


    /* =========================
       PRODUCTS
    ========================= */

    .products {
      padding: 35px 5px 150px;
    }

    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 5px;
    }


    /* =========================
       PRODUCT CARD
    ========================= */

    .product-card {
      background: #f6f6f6;

      overflow: hidden;

      transition:
        transform 0.4s ease,
        box-shadow 0.4s ease;
    }

    .product-card:hover {
      transform: scale(1.025);

      z-index: 5;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.10);
    }


    .product-image {
      width: 100%;
      height: 390px;

      background: #eee;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        transform 0.6s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.05);
    }


    .product-placeholder {
      font-size: 9px;
      letter-spacing: 2px;
      color: #aaa;
    }


    .product-info {
      padding: 20px;
    }


    .product-category {
      font-size: 8px;

      letter-spacing: 2px;

      color: #999;

      margin-bottom: 9px;
    }


    .product-name {
      font-size: 13px;

      margin-bottom: 12px;
    }


    .product-price {
      font-size: 13px;

      font-weight: 500;
    }


    .product-condition {
      margin-top: 8px;

      font-size: 9px;

      color: #888;
    }


    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding: 120px 20px;

      text-align: center;

      color: #999;
    }

    .empty-title {
      font-size: 13px;

      letter-spacing: 2px;

      margin-bottom: 12px;
    }

    .empty-text {
      font-size: 10px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid #eee;

      padding: 50px;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;
    }

    .footer-logo {
      font-size: 18px;

      letter-spacing: 5px;
    }

    .footer-text {
      font-size: 9px;

      line-height: 1.8;

      color: #999;

      text-align: right;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      header {
        padding: 0 20px;
      }

      nav {
        display: none;
      }

      .header-right {
        gap: 12px;
      }

      .page-title {
        padding: 90px 20px 60px;
      }

      .page-title h1 {
        font-size: 38px;
      }

      .filter-bar {
        padding: 0 20px 25px;
      }

      .product-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .product-image {
        height: 280px;
      }

      footer {
        padding: 35px 20px;

        flex-direction: column;

        gap: 25px;
      }

      .footer-text {
        text-align: left;
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <a
      href="index.html"
      class="logo"
    >
      CARDÉ
    </a>


    <nav>

      <a href="index.html#collection">
        COLLECTION
      </a>

      <a href="index.html#operator-shop">
        OPERATOR SHOP
      </a>

      <a href="sell.html">
        SELL
      </a>

      <a href="index.html#about">
        ABOUT
      </a>

    </nav>


    <div class="header-right">

      <a href="#">
        SEARCH
      </a>

      <a href="#">
        ♡
      </a>

      <a href="#">
        LOGIN
      </a>

    </div>

  </header>



  <!-- =========================
       TITLE
  ========================= -->

  <section class="page-title">

    <div class="eyebrow">
      CARDÉ COLLECTION
    </div>

    <h1>
      Pokémon
    </h1>

    <p>
      Discover Pokémon Cards
    </p>

  </section>



  <!-- =========================
       FILTER
  ========================= -->

  <div class="filter-bar">

    <div
      class="result-count"
      id="resultCount"
    >
      LOADING...
    </div>


    <select
      class="sort-select"
      id="sortSelect"
    >

      <option value="newest">
        NEWEST
      </option>

      <option value="low">
        PRICE LOW
      </option>

      <option value="high">
        PRICE HIGH
      </option>

    </select>

  </div>



  <!-- =========================
       PRODUCTS
  ========================= -->

  <section class="products">

    <div
      class="product-grid"
      id="productGrid"
    >
    </div>


    <div
      class="empty"
      id="empty"
      style="display:none;"
    >

      <div class="empty-title">
        NO PRODUCTS YET
      </div>

      <div class="empty-text">
        Pokémon cards listed on CARDÉ will appear here.
      </div>

    </div>

  </section>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <div class="footer-logo">
      CARDÉ
    </div>


    <div class="footer-text">

      CARDÉ — A CURATED CARD MARKET<br>

      © 2026 CARDÉ. ALL RIGHTS RESERVED.

    </div>

  </footer>



  <!-- =========================
       SUPABASE
  ========================= -->

  <script>

    const SUPABASE_URL =
      "https://byjnjciwsdwxuneusgau.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_9-MEV3xReYbJBBSQFAW_xA_sxniWNBl";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    let products = [];


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

      const grid =
        document.getElementById(
          "productGrid"
        );

      const empty =
        document.getElementById(
          "empty"
        );

      const count =
        document.getElementById(
          "resultCount"
        );


      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select(
            "id, category, card_name, price, condition, image_url, description, created_at"
          )
          .eq(
            "category",
            "Pokémon"
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        count.textContent =
          "ERROR";

        empty.style.display =
          "block";

        return;
      }


      products =
        data || [];


      count.textContent =
        products.length +
        " PRODUCTS";


      if (products.length === 0) {

        grid.innerHTML = "";

        empty.style.display =
          "block";

        return;
      }


      empty.style.display =
        "none";


      renderProducts(products);

    }



    /* =========================
       RENDER
    ========================= */

    function renderProducts(items) {

      const grid =
        document.getElementById(
          "productGrid"
        );


      grid.innerHTML = "";


      items.forEach(product => {

        const card =
          document.createElement(
            "a"
          );


        card.href =
          "product.html?id=" +
          product.id;


        card.className =
          "product-card";


        let imageHTML = "";


        if (product.image_url) {

          imageHTML = `

            <img
              src="${product.image_url}"
              alt="${product.card_name}"
            >

          `;

        }

        else {

          imageHTML = `

            <div class="product-placeholder">
              PRODUCT IMAGE
            </div>

          `;

        }


        card.innerHTML = `

          <div class="product-image">

            ${imageHTML}

          </div>


          <div class="product-info">

            <div class="product-category">
              ${product.category || "POKÉMON"}
            </div>


            <div class="product-name">
              ${product.card_name || "Untitled Card"}
            </div>


            <div class="product-price">
              ₩${Number(product.price || 0).toLocaleString()}
            </div>


            <div class="product-condition">
              ${product.condition || "Condition not specified"}
            </div>

          </div>

        `;


        grid.appendChild(
          card
        );

      });

    }



    /* =========================
       SORT
    ========================= */

    document
      .getElementById("sortSelect")
      .addEventListener(
        "change",
        function() {

          let sorted =
            [...products];


          if (
            this.value ===
            "low"
          ) {

            sorted.sort(
              (a,b) =>
                Number(a.price) -
                Number(b.price)
            );

          }


          if (
            this.value ===
            "high"
          ) {

            sorted.sort(
              (a,b) =>
                Number(b.price) -
                Number(a.price)
            );

          }


          if (
            this.value ===
            "newest"
          ) {

            sorted.sort(
              (a,b) =>
                new Date(b.created_at) -
                new Date(a.created_at)
            );

          }


          renderProducts(
            sorted
          );

        }
      );



    /* =========================
       START
    ========================= */

    loadProducts();

  </script>


</body>
</html>
